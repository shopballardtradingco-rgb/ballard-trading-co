name: btcore
x-app: &app
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp:rw,noexec,nosuid,size=64m]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: local
    options: {max-size: 10m, max-file: '3'}
services:
  database:
    image: btcore-postgres:verified
    restart: unless-stopped
    environment:
      POSTGRES_DB: btcore_recovery_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_ADMIN_PASSWORD:?Run initialize.py}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d btcore_recovery_dev]
      interval: 3s
      timeout: 3s
      retries: 30
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}
  provision:
    <<: *app
    image: btcore-app:verified
    restart: 'no'
    profiles: [maintenance]
    environment:
      DATABASE_URL: postgresql://postgres:${DATABASE_ADMIN_PASSWORD}@database:5432/btcore_recovery_dev
      BTCORE_APP_DB_PASSWORD: ${DATABASE_APP_PASSWORD:?Run initialize.py}
    command: [node, core/provision.mjs]
    depends_on:
      database: {condition: service_healthy}
  core:
    <<: *app
    image: btcore-app:verified
    env_file: ./private/core.env
    environment:
      BTCORE_APP_DATABASE_URL: postgresql://btcore_app:${DATABASE_APP_PASSWORD}@database:5432/btcore_recovery_dev
      BTCORE_ORIGIN: https://${CORE_HOST:?Set the Core hostname}
      BTCORE_ACCESS_MODE: private
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  connector:
    <<: *app
    image: btcore-connector:verified
    profiles: [publisher]
    user: '10001:10001'
    env_file: ./private/connector.env
    environment:
      PUBLIC_URL: https://${CONNECT_HOST:?Set the connector hostname}
      BTCORE_CALLBACK_URL: https://${CORE_HOST}/api/ebay/callback
      BTCO_DB_PATH: /data/btco.sqlite3
      PORT: '8000'
    volumes: [./private/connector-data:/data]
  edge:
    image: btcore-proxy:verified
    restart: unless-stopped
    environment:
      CORE_HOST: ${CORE_HOST}
      CONNECT_HOST: ${CONNECT_HOST}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy-config:/config
    depends_on:
      core: {condition: service_healthy}
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}
volumes:
  database:
  certificates:
  proxy-config:
