name: Public source verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: btco-os/core/package-lock.json
      - run: npm ci --prefix btco-os/core --ignore-scripts --no-audit --no-fund
      - run: npm run check --prefix btco-os/core
      - run: npm test --prefix btco-os/core
      - run: python3 -m unittest discover -s btco-os/tests -v
        env:
          PYTHONPATH: btco-os
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: btconnect
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock.txt
      - run: pip install -e '.[test]'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix btco-os/core --ignore-scripts --no-audit --no-fund
        working-directory: .
      - run: node --test tools/tests/publisher-handoff.test.mjs
        working-directory: .
        env:
          BTCO_CORE_HANDOFF_FILE: ${{ runner.temp }}/synthetic-core-handoff.json
      - run: python -m pytest -q
        env:
          BTCO_CORE_HANDOFF_FILE: ${{ runner.temp }}/synthetic-core-handoff.json
